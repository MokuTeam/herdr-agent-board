# nginx in front of the team hub on a server of your own with a domain (docs/team-quickstart.md,
# "Your own server with a domain"). The hub stays on loopback (127.0.0.1:7443, its default) and
# nginx brings TLS; the boards' team.hub is wss://hub.example.com.
#
# 1. A certificate for the name, for example: certbot certonly --nginx -d hub.example.com
# 2. Copy this file to /etc/nginx/sites-available/hab-hub and link it from sites-enabled (or put it
#    in /etc/nginx/conf.d/hab-hub.conf), replace hub.example.com and the two certificate paths.
# 3. nginx -t && systemctl reload nginx
#
# It sits inside nginx's http block, as every file in sites-enabled and conf.d does.

# A WebSocket upgrade is passed on as one; anything else goes to the hub with "Connection: close".
# The name is the hub's own, so it cannot clash with a $connection_upgrade map of another site.
map $http_upgrade $hab_hub_connection {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name hub.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name hub.example.com;

    ssl_certificate     /etc/letsencrypt/live/hub.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hub.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # The protocol's one path. The boards connect to wss://hub.example.com and add /v1 themselves.
    location = /v1 {
        proxy_pass http://127.0.0.1:7443;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $hab_hub_connection;
        proxy_set_header Host $host;
        # The hub logs this address with --trust-proxy: the rightmost entry, the one nginx saw.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A board pings every 30 s and drops a connection after 75 s without a word. nginx's own
        # 60 s would do; 300 s leaves the board's timer in charge of a dead connection.
        proxy_connect_timeout 5s;
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
    }

    # Nothing else is served, the hub's own GET / health line included (it stays on loopback).
    location / {
        return 404;
    }
}
