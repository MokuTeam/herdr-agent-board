id = "agent-board"
name = "Agent board"
version = "0.1.0"
min_herdr_version = "0.9.2"
description = "Kanban of the Claude sessions in herdr: who works, who waits on you or on someone else, in lanes by category. Jump to a session or message it from the board."
platforms = ["windows", "linux", "macos"]

# Runs on `herdr plugin install` (not on `plugin link`): fetches react, react-dom and the quick
# look's viewers' libraries (package.json).
[[build]]
command = ["bun", "install", "--production"]

# After a herdr start: the board workspace comes up in the background, so the key is instant.
[[startup]]
command = ["bun", "src/entrypoints/open.ts", "--background"]

# Toggle: opens the board, focuses it when it is open elsewhere, goes back when it is focused.
[[actions]]
id = "open"
title = "Agent board"
contexts = ["workspace", "pane"]
command = ["bun", "src/entrypoints/open.ts"]

[[actions]]
id = "web"
title = "Agent board (web)"
contexts = ["workspace", "pane"]
command = ["bun", "src/entrypoints/web-open.ts"]

[[actions]]
id = "install"
title = "Agent board: install the board and spawn-agent commands and the Claude Code hooks"
contexts = ["workspace"]
command = ["bun", "src/entrypoints/install.ts"]

# Windows and macOS: notifications with the agent's words; a click opens the session on the board.
[[actions]]
id = "notifications"
title = "Agent board: desktop notifications (Windows)"
contexts = ["workspace"]
command = ["bun", "src/entrypoints/install.ts", "--toast"]

[[actions]]
id = "doctor"
title = "Agent board: check the setup"
contexts = ["workspace"]
command = ["bun", "src/entrypoints/cli.ts", "doctor"]

[[panes]]
id = "board"
title = "Agent board"
placement = "overlay"
# run.ts restarts the board when the plugin's code changes.
command = ["bun", "src/entrypoints/run.ts"]

# Wake: puts sessions to sleep and wakes them (src/entrypoints/wake-start.ts). Never awaited by the board's own start.
[[startup]]
command = ["bun", "src/entrypoints/wake-start.ts"]

[[actions]]
id = "sleep"
title = "Put this Claude session to sleep"
contexts = ["pane"]
command = ["bun", "src/entrypoints/wake-action.ts", "sleep"]

[[actions]]
id = "wake"
title = "Wake the Claude session in this pane"
contexts = ["pane"]
command = ["bun", "src/entrypoints/wake-action.ts", "wake"]

# The wake process under its supervisor (src/entrypoints/wake-run.ts), in a tab of the Wake workspace.
[[panes]]
id = "wake"
title = "Wake"
placement = "tab"
command = ["bun", "src/entrypoints/wake-run.ts"]
